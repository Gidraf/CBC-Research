version: '3.8'

services:
  gdrive-viewer:
    build: .
    container_name: gdrive_playwright_viewer
    ports:
      - "5550:5550"
    volumes:
      - ./downloads:/app/downloads
      - ./extracted_text:/app/extracted_text
      - ./gdrive_files.db:/app/gdrive_files.db
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gdrive_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery-worker:
    build: .
    container_name: gdrive_celery_worker
    command: celery -A celery_worker.celery_app worker --loglevel=info
    volumes:
      - ./downloads:/app/downloads
      - ./extracted_text:/app/extracted_text
      - ./gdrive_files.db:/app/gdrive_files.db
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
