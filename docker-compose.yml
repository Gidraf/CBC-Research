# ─────────────────────────────────────────────────────────────────────────────
# YAML ANCHORS
# ─────────────────────────────────────────────────────────────────────────────
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-image: &app-image gdrive-playwright-viewer:latest

x-app-depends: &app-depends
  redis:
    condition: service_healthy
  postgres:
    condition: service_healthy

x-app-volumes: &app-volumes
  - ./downloads:/app/downloads
  - ./extracted_text:/app/extracted_text

x-app-extra-hosts: &app-extra-hosts
  - "host.docker.internal:host-gateway"

x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/cbc_research}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-cbc-research-files}

# ─────────────────────────────────────────────────────────────────────────────
# SERVICES
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── FastAPI / Playwright Viewer Server ─────────────────────────────────────
  gdrive-viewer:
    build: *app-build
    image: *app-image
    container_name: gdrive_playwright_viewer
    restart: always
    ports:
      - "5550:5550"
    command: >
      uvicorn app:app
        --host 0.0.0.0
        --port 5550
        --workers 1
        --log-level info
    env_file: .env
    environment:
      <<: *app-env
    networks:
      - app-network
    depends_on: *app-depends
    volumes: *app-volumes
    extra_hosts: *app-extra-hosts
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/api/stats || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  # ── Celery Worker Service ──────────────────────────────────────────────────
  celery-worker:
    build: *app-build
    image: *app-image
    container_name: gdrive_celery_worker
    restart: always
    command: celery -A celery_worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    networks:
      - app-network
    depends_on: *app-depends
    volumes: *app-volumes
    extra_hosts: *app-extra-hosts
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500M
        reservations:
          memory: 512M

  # ── PostgreSQL 15 Relational Database ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: gdrive_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:

      POSTGRES_DB: cbc_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cbc_research"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # ── MinIO S3-Compatible Object Storage ─────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: gdrive_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - app-network
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # ── Redis 7 Cache & Task Broker ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gdrive_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
